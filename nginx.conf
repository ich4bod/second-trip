server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;
    types { application/javascript js mjs; text/css css; }

    location = /healthz {
        default_type text/plain;
        return 200 "ok";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
